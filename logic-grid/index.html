function save(){Object.assign(db,{mode,level,size,serial});if(game){game.history=history;db.games[id]=game;}try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){storageOK=false}}
function openGame(){id=mode==='learn'?'l'+level:mode==='daily'?'d'+today():'e'+size+'-'+serial;let n=mode==='learn'?5:mode==='daily'?8:size,old=db.games[id];if(old&&Array.isArray(old.sol)&&old.sol.length===n*n&&Array.isArray(old.cells)&&old.cells.length===n*n&&old.fixed){game=old}else{let rand=rng(hash(id)),sol=mode==='learn'?HAND[level].replaceAll('/','').split('').map(Number):Array.from({length:n*n},()=>rand()<.57?1:0);if(!sol.some(Boolean))sol[0]=1;let fixed=unique(sol,n);game={n,sol,fixed,cells:sol.map((v,i)=>fixed[i]!==undefined?(v?1:-1):0),hints:0,seconds:0,won:false}}history=Array.isArray(game.history)?game.history:[];notice='';previousDone=new Set();save();render()}

function lineGood(a){return a.every(i=>(game.cells[i]===1?1:0)===game.sol[i])}function draw(){let n=game.n,c=clues(game.sol,n),b=$('board'),done=new Set();b.style.gridTemplateColumns='48px repeat('+n+', minmax(0,1fr))';b.style.gridTemplateRows=Math.max(44,Math.max(...c.cols.map(a=>a.length))*17)+'px repeat('+n+', auto)';b.ariaLabel=I18N[lang].board;function cl(a,key,col){let good=lineGood(a);if(good)done.add(key);return 'clue '+(col?'col ':'')+(good?'done ':'')+(good&&!previousDone.has(key)?'new':'')}let html='<div></div>';for(let k=0;k<n;k++)html+='<div class="'+cl(Array.from({length:n},(_,r)=>r*n+k),'c'+k,true)+'">'+c.cols[k].map(v=>'<span>'+v+'</span>').join('')+'</div>';for(let r=0;r<n;r++){html+='<div class="'+cl(Array.from({length:n},(_,k)=>r*n+k),'r'+r,false)+'">'+c.rows[r].join(' ')+'</div>';for(let k=0;k<n;k++){let i=r*n+k,v=game.cells[i];html+='<div role="gridcell" tabindex="'+(i===0?'0':'-1')+'" data-i="'+i+'" class="tile '+(v===1?'filled ':'')+(game.fixed[i]!==undefined?'fixed ':'')+(mode==='learn'&&level===0&&!game.won&&r===0&&v!==1?'guide':'')+'" aria-label="'+I18N[lang].cell+' '+(r+1)+', '+(k+1)+'" aria-selected="'+(v===1)+'" aria-readonly="'+(game.fixed[i]!==undefined)+'">'+(v===-1?'×':'')+'</div>'}}b.innerHTML=html;previousDone=done;$('bar').style.width=100*game.cells.filter((v,i)=>v===1&&game.sol[i]).length/game.sol.filter(Boolean).length+'%'}
function tone(win=false){if(db.settings.mute)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});let now=audio.currentTime;for(let j=0;j<(win?3:1);j++){let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=win?[440,554,659][j]:360;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.04,now+j*.09);g.gain.exponentialRampToValueAtTime(.001,now+j*.09+.12);o.start(now+j*.09);o.stop(now+j*.09+.13)}}catch(e){}}function time(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function check(){if(!game.sol.every((v,i)=>(game.cells[i]===1?1:0)===v))return;game.won=true;let stars=game.hints===0?3:game.hints<=2?2:1;db.stars[id]=Math.max(db.stars[id]||0,stars);$('winStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);$('winDetail').textContent=game.n+' × '+game.n+' · '+time(game.seconds);tone(true);if(!$('win').open)$('win').showModal();if(Date.now()-lastAd>180000){lastAd=Date.now();window.APP_AD('level-complete')}}
