function renderToday(){let d=day(),n=total(),p=Math.min(100,Math.round(n/d.goal*100));$('main').innerHTML=`<section class="card hero"><div class="eyebrow">${t('daily')}</div><div class="visual" role="img" aria-label="${p}%"><svg class="ring" viewBox="0 0 238 238" aria-hidden="true"><circle cx="119" cy="119" r="105"/><circle class="progress" cx="119" cy="119" r="105" style="stroke-dashoffset:${660*(1-p/100)}"/></svg><div class="glass" aria-hidden="true"><div class="water" style="height:${Math.min(92,n/d.goal*92)}%"></div></div><div class="percent">${p}%</div></div><h2 class="amount">${number(n)} <span>/ ${number(d.goal)} ${t('ml')}</span></h2><p class="muted">${n>=d.goal?t('done'):number(d.goal-n)+' '+t('ml')+' '+t('left')}</p><div class="portions"><button class="portion" id="glass"><span class="symbol" aria-hidden="true">♧</span><b>${t('glass')}</b><small>250 ${t('ml')}</small></button><button class="portion" id="bottle"><span class="symbol" aria-hidden="true">♙</span><b>${t('bottle')}</b><small>500 ${t('ml')}</small></button><button class="portion" id="custom"><span class="symbol" aria-hidden="true">＋</span><b>${t('custom')}</b><small>${number(state.custom)} ${t('ml')}</small></button></div><p class="hint">${d.entries.length?'':t('start')}</p></section><div class="row section-title"><h2>${t('log')}</h2><button id="undo" class="undo" ${d.entries.length?'':'disabled'}>${t('undo')}</button></div><section class="card">${d.entries.length?d.entries.slice().reverse().map(e=>`<div class="entry"><span class="dot" aria-hidden="true">◌</span><span class="muted">${fmtDate(new Date(e.time),{hour:'2-digit',minute:'2-digit'})}</span><strong>+ ${number(e.ml)} ${t('ml')}</strong></div>`).join(''):`<div class="empty">${t('empty')}</div><p class="hint">${t('targetHint')}</p>`}</section>${!storageOK?`<p class="hint" role="status">${t('storage')}</p>`:''}`;$('glass').onclick=()=>add(250);$('bottle').onclick=()=>add(500);$('custom').onclick=custom;$('undo').onclick=()=>{day().entries.po function add(ml){let d=day(),before=total();d.entries.push({ml,time:Date.now()});persist();closeDialog();render();let hero=document.querySelector('.hero');if(hero){hero.classList.add('splash');setTimeout(()=>hero.classList.remove('splash'),300)}if(before<d.goal&&total()>=d.goal){toast(t('celebrate'));if(hero)for(let i=0;i<18;i++){let el=document.createElement('i');el.className='drop';el.style.setProperty('--x',`${Math.cos(i/18*Math.PI*2)*140}px`);el.style.setProperty('--y',`${Math.sin(i/18*Math.PI*2)*150}px`);hero.append(el);setTimeout(()=>el.remove(),300)}}else toast(t('added'));if(Date.now()-lastAd>180000){lastAd=Date.now();window.APP_AD('after-save')}}
let returnFocus=null;function dialog(html){returnFocus=document.activeElement;$('overlay').innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">${html}</section>`;$('overlay').hidden=false;const el=$('overlay').querySelector('input,button');if(el)el.focus()}function closeDialog(){$('overlay').hidden=true;$('overlay').innerHTML='';if(returnFocus&&returnFocus.isConnected)returnFocus.focus()}

function renderHistory(){let dates=Array.from({length:range},(_,i)=>{let d=new Date();d.setDate(d.getDate()-range+1+i);return d}),values=dates.map(d=>total(dateKey(d))),max=Math.max(state.goal,...values),sum=values.reduce((a,b)=>a+b,0),achieved=dates.filter(d=>total(dateKey(d))>=day(dateKey(d)).goal).length;$('main').innerHTML=`<h2>${t('history')}</h2><div class="tabs">${[7,30].map(n=>`<button data-range="${n}" class="${range===n?'selected':''}" aria-pressed="${range===n}">${n} ${t('days')}</button>`).join('')}</div><section class="card"><div class="eyebrow">${t('total')} · ${number(sum)} ${t('ml')}</div><div class="chart" role="img" aria-label="${t('history')}">${dates.map((d,i)=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(2,values[i]/max*115)}px" title="${dateKey(d)}: ${values[i]} ${t('ml')}"></div><div class="bar-label">${range===7||i%5===0||i===29?d.getDate():''}</div></div>`).join('')}</div><div class="stats"><div class="stat"><b>${number(Math.round(sum/range))} <small>${t('ml')}</small></b><small>${t('average')}</small></div><div class="stat"><b>${achieved} / ${range}</b><small>${t('reached')}</small></div></div><div class="history-list">${dates.slice().reverse().map(d=>{let k=dateKey(d);return `<div class="entry"><span>${fmtDate(d,{month:'short',day:'numeric'})}<br><small>${number(day(k).goal)} ${t('ml')} · ${t('goal')}</small></span><strong>${number(total(k))} ${t('ml')} ${total(k)>=day(k).goal?'✓':''}</strong></div>`}).join('')}</div></section>`;$('main').querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=+b.dataset.range;renderHistory()})}
function field(key,html){return `<label class="field"><span>${t(key)}</span>${html}</label>`}function options(list,value){return list.map(([v,l])=>`<option value="${v}" ${String(value)===String(v)?'selected':''}>${l}</option>`).join('')}
function renderSettings(){$('main').innerHTML=`<h2 class="section-title">${t('settings')}</h2><form id="settingsForm"><section class="card"><h2>${t('personal')}</h2><div class="grid">${field('weight',`<input name="weight" id="weight" type="number" min="20" max="300" step="0.1" value="${state.weight}" required><small>20–300 kg</small>`)}${field('activity',`<select name="activity" id="activity">${options([[0,t('low')],[350,t('medium')],[700,t('high')]],state.activity)}</select>`)}</div><p class="hint">${t('formula')}</p><button type="button" id="estimate" class="full" style="margin-top:12px">${t('suggest')} · <span id="estimateValue"></span> ${t('ml')}</button>${field('manual',`<input id="goal" name="goal" type="number" min="250" max="10000" step="1" value="${state.goal}" required><small>250–10 000 ${t('ml')}</small>`)}</section><section class="card"><h2>${t('reminders')}</h2><label class="field row"><span>${t('enabled')}</span><input name="reminders" type="checkbox" ${state.reminders?'checked':''} style="width:48px;height:44px;accent-color:var(--accent)"></label>${field('every',`<input name="interval" type="number" min="5" max="240" step="1" value="${state.interval}" required><small>5–240</small>`)}<div class="grid">${field('from',`<input name="from" type="time" value="${state.from}" required>`)}${field('until',`<input name="until" type="time" value="${state.until}" required>`)}</div><p class="hint">${t('reminderHint')}</p></section><section class="card">${field('language',`<select id="language" name="lang">${options(Object.entries(languages),state.lang)}</select>`)}${field('theme',`<select id="theme" name="theme">${options(['system','light','dark'].map(k=>[k,t(k)]),state.theme)}</select>`)}<p class="hint">${t('privacy')}</p></section><button type="submit" class="primary full">${t('save')}</button><p class="hint" id="settingsError" role="status"></p></form>`;const estimate=()=>Math.round((Number($('weight').value)*30+Number($('activity').value))/50)*50;const update=( document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape')closeDialog();if(e.key==='Tab'){const els=[...$('overlay').querySelectorAll('button,input')];let first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDialog()};
function tick(){const now=new Date(),key=dateKey(now);if(key!==currentDay){currentDay=key;persist();render()}if(document.hidden||!state.reminders||!$('overlay').hidden)return;const mins=now.getHours()*60+now.getMinutes(),toMin=s=>Number(s.slice(0,2))*60+Number(s.slice(3)),start=toMin(state.from),end=toMin(state.until),slot=Math.floor((mins-start)/state.interval),slotKey=key+':'+slot;if(mins<start||mins>end||lastReminder===slotKey||total()>=day().goal)return;lastReminder=slotKey;dialog(`<h2 id="dialogTitle">${t('remind')}</h2><p class="muted">${t('reminderHint')}</p><div class="row"><button id="later">${t('later')}</button><button id="sip" class="primary">+250 ${t('ml')}</button></div>`);$('later').onclick=closeDialog;$('sip').onclick=()=>add(250)}
