};
const $=id=>document.getElementById(id),KEY='fair-split-v1',currencies=['USD','EUR','GBP','BRL','MXN','CAD','AUD','CHF','TRY','IDR','JPY','KRW','INR','KZT','CNY','SEK','NOK','DKK','PLN','CZK','NZD','SGD','MYR','THB','PHP','ZAR','AED','SAR'];
function deviceCurrency(){const loc=navigator.language||'en-US',r=loc.split('-')[1]?.toUpperCase();return ({US:'USD',GB:'GBP',BR:'BRL',MX:'MXN',CA:'CAD',AU:'AUD',CH:'CHF',TR:'TRY',ID:'IDR',JP:'JPY',KR:'KRW',IN:'INR',KZ:'KZT',CN:'CNY',SE:'SEK',NO:'NOK',DK:'DKK',PL:'PLN',CZ:'CZK',NZ:'NZD',SG:'SGD',MY:'MYR',TH:'THB',PH:'PHP',ZA:'ZAR',AE:'AED',SA:'SAR'})[r]||({es:'EUR',pt:'BRL',de:'EUR',fr:'EUR',it:'EUR',tr:'TRY',id:'IDR'})[loc.split('-')[0]]||'USD'}
function fresh(){return {mode:'equal',amount:'',tax:'',tip:'',count:2,names:['',''],items:[]}}
let state={lang:I18N[(navigator.language||'en').split('-')[0]]?(navigator.language||'en').split('-')[0]:'en',theme:'system',currency:deviceCurrency(),draft:fresh(),history:[]},storageOK=true;
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&I18N[old.lang]&&currencies.includes(old.currency)&&old.draft&&Array.isArray(old.draft.items)&&Array.isArray(old.draft.names)&&Number.isInteger(old.draft.count)&&old.draft.count>=1&&old.draft.count<=50&&['equal','items'].includes(old.draft.mode)){state={...state,...old};state.history=Array.isArray(old.history)?old.history.slice(0,20):[]}}catch(e){storageOK=false}
let result=null,toastTimer,adTime=-Infinity;window.APP_AD = (place) => {};
const t=k=>I18N[state.lang][k],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){if(storageOK){storageOK=false;toast(t('storage'))}}}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function decimals(c=state.currency){return new Intl.NumberFormat('en',{style:'currency',currency:c}).resolvedOptions().maximumFractionDigits}
function money(n,c=state.currency){return new Intl.NumberFormat(state.lang,{style:'currency',currency:c}).format(n/10**decimals(c))}
function num(s){s=String(s??'').trim().replace(',','.');return s===''?0:/^\d+(\.\d*)?$/.test(s)?Number(s):NaN}
function name(i){return state.draft.names[i]?.trim()||`${t('person')} ${i+1}`}
function allocate(total,weights){const sum=weights.reduce((a,b)=>a+b,0);if(!sum)return weights.map(()=>0);const raw=weights.map(w=>total*w/sum),out=raw.map(Math.floor),left=total-out.reduce((a,b)=>a+b,0),order=raw.map((v,i)=>({i,f:v-out[i]})).sort((a,b)=>b.f-a.f||a.i-b.i);for(let k=0;k<left;k++)out[order[k%order.length].i]++;return out}
function calculate(){const d=state.draft,factor=10**decimals(),tax=num(d.tax),tip=num(d.tip);let base=0,weights=Array(d.count).fill(0),error='';const valid=v=>Number.isFinite(v)&&v>=0&&v<=1e9;if(!Number.isFinite(tax)||tax<0||tax>100||!Number.isFinite(tip)||tip<0||tip>100)error='invalid';if(d.mode==='equal'){const a=num(d.amount);if(!valid(a))error='invalid';else{base=Math.round(a*factor);weights.fill(1)}}else{for(const item of d.items){const a=num(item.price);if(!valid(a)){error='invalid';continue}const cents=Math.round(a*factor),owners=item.owners.filter(i=>i>=0&&i<d.count);base+=cents;if(!owners.length){error='unassigned';continue}owners.forEach(i=>weights[i]+=cents/owners.length)}}if(base>1e9*factor)error='invalid';const taxValue=Math.round(base*(Number.isFinite(tax)&&tax>=0&&tax<=100?tax:0)/100),tipValue=Math.round(base*(Number.isFinite(tip)&&tip>=0&&tip<=100?tip:0)/100),total=base+taxValue+tipValue;return {base,tax:taxValue,tip:tipValue,total,shares:allocate(total,weights),error:error||(!base?'needBill':'')}}
function update(){result=calculate();const ok=!result.error;$('grandTotal').textContent=money(result.total);$('subtotal').textContent=money(result.base);$('taxTotal').textContent=money(result.tax);$('tipTotal').textContent=money(result.tip);$('summary').textContent=`${state.draft.count} ${t('each')} · ${t(state.draft.mode==='equal'?'equal':'byItems')}`;$('payers').innerHTML=result.shares.map((s,i)=>`<div class="payer"><span class="avatar">${String(i+1).padStart(2,'0')}</span><span>${esc(name(i))}</span><strong>${money(s)}</strong></div>`).join('');$('errors').textContent=result.error&&result.error!=='needBill'?t(result.error):'';$('copy').disabled=!ok;$('save').disabled=!ok;$('peopleBadge').textContent=state.draft.count;$('minus').disabled=state.draft.count<=1;$('plus').disabled=state.draft.count>=50;persist()}
function renderNames(){$('names').innerHTML=Array.from({length:state.draft.count},(_,i)=>`<label>${t('person')} ${i+1}<input data-name="${i}" aria-label="${t('name')} ${i+1}" maxlength="32" value="${esc(state.draft.names[i]||'')}" placeholder="${t('person')} ${i+1}"></label>`).join('')}
function renderItems(){$('items').innerHTML=state.draft.items.map((item,j)=>`<div class="item"><div class="row"><input data-item-name="${j}" value="${esc(item.name)}" placeholder="${t('item')} ${j+1}" aria-label="${t('item')} ${j+1}" maxlength="60"><input class="price" data-item-price="${j}" value="${esc(item.price)}" inputmode="decimal" placeholder="0.00" aria-label="${t('price')} ${j+1}" maxlength="14"><button class="delete" data-remove="${j}" aria-label="${t('remove')}">×</button></div><div class="assign">${Array.from({length:state.draft.count},(_,i)=>`<label><input type="checkbox" data-owner="${j}" data-person="${i}" ${item.owners.includes(i)?'checked':''}><span>${esc(name(i))}</span></label>`).join('')}</div></div>`).join('')}
function setTheme(){document.documentElement.dataset.theme=state.theme==='dark'||(state.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
function render(){document.documentElement.lang=state.lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));$('historyBtn').ariaLabel=t('history');$('settingsBtn').ariaLabel=t('settings');$('minus').ariaLabel=t('people')+' −';$('plus').ariaLabel=t('people')+' +';$('people').ariaLabel=t('people');$('copyText').ariaLabel=t('copy');$('equalBtn').classList.toggle('active',state.draft.mode==='equal');$('itemsBtn').classList.toggle('active',state.draft.mode==='items');$('equalBtn').setAttribute('aria-pressed',state.draft.mode==='equal');$('itemsBtn').setAttribute('aria-pressed',state.draft.mode==='items');$('equalPanel').hidden=state.draft.mode!=='equal';$('itemsPanel').hidden=state.draft.mode!=='items';['amount','tax','tip'].forEach(id=>$(id).value=state.draft[id]);$('people').value=state.draft.count;$('language').value=state.lang;$('currency').innerHTML=currencies.map(c=>`<option value="${c}">${c}</option>`).join('');$('currency').value=state.currency;$('theme').innerHTML=['system','light','dark'].map(k=>`<option value="${k}">${t(k)}</option>`).join('');$('theme').value=state.theme;setTheme();renderNames();renderItems();update()}
function count(v){if(!Number.isInteger(v)||v<1||v>50){$('people').value=state.draft.count;return}state.draft.count=v;while(state.draft.names.length<v)state.draft.names.push('');state.draft.items.forEach(item=>item.owners=item.owners.filter(i=>i<v));$('people').value=v;renderNames();renderItems();update()}
function open(id){$(id).showModal()}
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());
['amount','tax','tip'].forEach(id=>$(id).addEventListener('input',()=>{state.draft[id]=$(id).value;update()}));$('people').addEventListener('change',()=>count(Number($('people').value)));$('minus').onclick=()=>count(state.draft.count-1);$('plus').onclick=()=>count(state.draft.count+1);
$('names').addEventListener('input',e=>{if(e.target.dataset.name!==undefined){state.draft.names[+e.target.dataset.name]=e.target.value;renderItems();update()}});
$('items').addEventListener('input',e=>{const el=e.target;if(el.dataset.itemName!==undefined)state.draft.items[+el.dataset.itemName].name=el.value;if(el.dataset.itemPrice!==undefined)state.draft.items[+el.dataset.itemPrice].price=el.value;if(el.dataset.owner!==undefined){const item=state.draft.items[+el.dataset.owner],i=+el.dataset.person;item.owners=el.checked?[...new Set([...item.owners,i])]:item.owners.filter(n=>n!==i)}update()});
$('items').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){state.draft.items.splice(+b.dataset.remove,1);renderItems();update()}});
function addItem(){state.draft.items.push({name:'',price:'',owners:Array.from({length:state.draft.count},(_,i)=>i)});renderItems();update()}
$('addItem').onclick=()=>{addItem();$('items').lastElementChild.querySelector('input').focus()};$('equalBtn').onclick=()=>{state.draft.mode='equal';render()};$('itemsBtn').onclick=()=>{state.draft.mode='items';if(!state.draft.items.length)addItem();render()};
$('settingsBtn').onclick=()=>open('settings');$('language').onchange=()=>{state.lang=$('language').value;render()};$('currency').onchange=()=>{state.currency=$('currency').value;render()};$('theme').onchange=()=>{state.theme=$('theme').value;setTheme();persist()};matchMedia('(prefers-color-scheme: dark)').addEventListener('change',setTheme);
function summaryText(){const d=state.draft,lines=['Fair Split',`${t('total')}: ${money(result.total)}`,'',...result.shares.map((s,i)=>`${name(i)}  →  ${money(s)}`),'',`${t('subtotal')}: ${money(result.base)}`,`${t('tax')}: ${d.tax||0}% · ${money(result.tax)}`,`${t('tip')}: ${d.tip||0}% · ${money(result.tip)}`];if(d.mode==='items'){lines.push('',t('items')+':');d.items.forEach((item,j)=>lines.push(`${item.name.trim()||t('item')+' '+(j+1)} · ${money(Math.round(num(item.price)*10**decimals()))} → ${item.owners.map(name).join(', ')}`))}return lines.join('\n')}
$('copy').onclick=async()=>{if(result.error)return;const text=summaryText();try{if(!navigator.clipboard?.writeText)throw Error();await navigator.clipboard.writeText(text);toast(t('copied'))}catch(e){$('copyText').value=text;open('copyDialog');$('copyText').select()}};
$('save').onclick=()=>{if(result.error)return;state.history.unshift({date:new Date().toISOString(),currency:state.currency,draft:JSON.parse(JSON.stringify(state.draft)),total:result.total});state.history=state.history.slice(0,20);persist();toast(t('saved'));if(performance.now()-adTime>=180000){adTime=performance.now();window.APP_AD('saved')}};
$('historyBtn').onclick=()=>{$('historyList').innerHTML=state.history.length?state.history.map((h,i)=>`<button class="history-entry" data-history="${i}"><small>${esc(new Date(h.date).toLocaleString(state.lang,{dateStyle:'medium',timeStyle:'short'}))}</small><strong>${money(h.total,h.currency)}</strong><small>${h.draft.count} ${t('each')} · ${t(h.draft.mode==='equal'?'equal':'byItems')}</small></button>`).join(''):`<p class="empty">${t('empty')}</p>`;open('history')};$('historyList').onclick=e=>{const b=e.target.closest('[data-history]');if(!b)return;const h=state.history[+b.dataset.history];state.currency=h.currency;state.draft=JSON.parse(JSON.stringify(h.draft));$('history').close();render();toast(t('restored'))};$('new').onclick=()=>open('resetDialog');$('resetYes').onclick=()=>{state.draft=fresh();$('resetDialog').close();render();$('amount').focus()};render();if(!storageOK)toast(t('storage'));
</script><!--arlo-license--><div id="arlo-copyright" style="font:11px/1.4 system-ui,sans-serif;opacity:.45;text-align:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;user-select:none">© 2026 Fair Split</div><!--/arlo-license-->
