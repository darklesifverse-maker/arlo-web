<style>
:root,[data-theme=dark]{--bg:#06070b;--bg2:#0e1119;--card:#11141e;--line:#1e2433;--ink:#e8e4da;--mute:#878c9f;--acc:#9ad8c8;--warm:#f2c38b;--accInk:#062019;--sel:rgba(154,216,200,.08);--pupil:rgba(6,7,11,.74);--dan:#c4554d}
[data-theme=light]{--bg:#f3efe6;--bg2:#ebe5d8;--card:#fffdf8;--line:#e2dacb;--ink:#1c2030;--mute:#6b6e7c;--acc:#2d7a6c;--warm:#c47a2c;--accInk:#ffffff;--sel:rgba(45,122,108,.08);--pupil:rgba(255,253,248,.8);--dan:#b5463f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font:15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 16px)}
.top{display:flex;align-items:center;gap:8px;height:56px}
.brand{flex:1;display:flex;align-items:center;gap:10px;font-weight:650;font-size:18px;letter-spacing:.01em;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.ib .i{width:22px;height:22px}
.hero{position:relative;height:min(72vw,300px);min-height:236px;display:grid;place-items:center}
#orb{position:absolute;inset:0;width:100%;height:100%}
.play{position:relative;width:84px;height:84px;border-radius:50%;background:var(--pupil);display:grid;place-items:center;transition:transform .2s}
.play:active{transform:scale(.93)}
.play .i{width:34px;height:34px}
.status{position:absolute;bottom:2px;left:0;right:0;text-align:center;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{margin-top:18px}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:24px}
h2{font-size:12px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.tleft{font-variant-numeric:tabular-nums;color:var(--warm);font-size:13px;font-weight:650;text-align:right}
.chips{display:flex;gap:6px}
.chip{flex:1;min-height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:650;font-size:14px;padding:0 6px;white-space:nowrap;transition:background .2s,color .2s}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accInk);border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 12px 12px 14px}
.card .row-h{margin-bottom:4px}
.ghost{min-height:44px;padding:0 12px;border-radius:14px;display:flex;align-items:center;gap:6px;font-weight:650;font-size:14px;color:var(--acc)}
.ghost .i{width:20px;height:20px}
.layer{display:flex;align-items:center;gap:10px;min-height:56px}
.li{width:40px;height:40px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;color:var(--acc);flex:none}
.li .i{width:22px;height:22px}
.lm{flex:1;min-width:0}
.ln{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mute);flex:none}
.x .i{width:20px;height:20px}
.hint{color:var(--mute);font-size:13px;padding:4px 0 2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;display:block;--p:70%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p) 100% no-repeat,var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--ink);margin-top:-9px;border:0}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--ink);border:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{min-height:92px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px 4px;font-size:13px;font-weight:650;text-align:center;line-height:1.2;transition:background .2s,border-color .2s,transform .15s;min-width:0;overflow-wrap:anywhere}
.tile .i{width:28px;height:28px;color:var(--mute);transition:color .2s}
.tile[aria-pressed=true]{border-color:var(--acc);background:var(--sel)}
.tile[aria-pressed=true] .i{color:var(--acc)}
.tile:active,.chip:active,.fm:active{transform:scale(.96)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{display:flex;align-items:center;gap:8px;min-height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line);padding:6px 12px;text-align:left;font-size:14px;font-weight:650;line-height:1.2;transition:transform .15s;min-width:0}
.preset .ics{display:flex;color:var(--warm)}
.preset .ics .i{width:18px;height:18px;margin-right:-3px}
.fav{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px;margin-bottom:8px}
.fm{flex:1;min-width:0;min-height:52px;text-align:left;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;border-radius:14px;transition:transform .15s}
.fn{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12px}
.fs .i{width:16px;height:16px;color:var(--acc)}
.empty{color:var(--mute);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:18px;text-align:center}
.foot{margin-top:26px;color:var(--mute);font-size:12px;text-align:center;opacity:.8}
.back{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;z-index:20}
.back.on{opacity:1;visibility:visible;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;padding:22px calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;z-index:21}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font-size:19px;margin-bottom:6px}
.sheet p{color:var(--mute)}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;min-height:48px;border-radius:16px;font-weight:650;background:var(--bg2)}
.btn.pri{background:var(--acc);color:var(--accInk)}
.btn.dan{background:var(--dan);color:#fff}
.txt{width:100%;min-height:48px;margin-top:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
.srow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow>span{font-weight:600}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:3px}
.seg button{min-height:44px;padding:0 12px;border-radius:11px;font-size:14px;font-weight:650;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink)}
select{min-height:44px;border-radius:12px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);padding:0 10px;font:inherit;max-width:100%}
.sw{width:60px;height:44px;position:relative;flex:none}
.sw::before{content:"";position:absolute;left:4px;right:4px;top:10px;height:24px;border-radius:12px;background:var(--line);transition:background .2s}
.sw::after{content:"";position:absolute;top:13px;left:7px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-pressed=true]::before{background:var(--acc)}
.sw[aria-pressed=true]::after{transform:translateX(28px)}
.sml{font-size:12px;color:var(--mute);margin-top:14px}
#night{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s;cursor:pointer}
#night.on{opacity:1;visibility:visible;transition:opacity .3s}
.clock{font-size:64px;font-weight:200;color:#2c2f37;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ntimer{color:#3b3527;font-size:15px;min-height:20px;font-variant-numeric:tabular-nums}
.ndot{width:14px;height:14px;border-radius:50%;background:#1d3a34}
.nhint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 34px);color:#2c2f35;font-size:13px;transition:opacity .3s}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 24px);margin:0 auto;max-width:420px;width:max-content;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;text-align:center;opacity:0;transform:translateY(16px);transition:opacity .25s,transform .25s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}

<div class="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><mask id="bm"><rect width="512" height="512" fill="#fff"/><circle cx="300" cy="214" r="104" fill="#000"/></mask></defs><circle cx="256" cy="256" r="196" fill="none" stroke="var(--acc)" stroke-opacity=".35" stroke-width="22"/><circle cx="256" cy="256" r="122" fill="var(--warm)" mask="url(#bm)"/></svg><span data-i="name"></span></div>
    <button class="ib" id="nightBtn"></button>
    <button class="ib" id="setBtn"></button>
  </header>

  <section class="hero">
    <canvas id="orb"></canvas>
    <button class="play" id="playBtn"></button>
    <div class="status" id="status"></div>
  </section>

  <section class="sec">
    <div class="row-h"><h2 data-i="timer"></h2><span class="tleft" id="tleft"></span></div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="sec card">
    <div class="row-h"><h2 data-i="mixTitle"></h2><button class="ghost" id="saveBtn"></button></div>
    <div id="layers"></div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="sec">
    <div class="row-h"><h2 data-i="sounds"></h2></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="sec">
    <div class="row-h"><h2 data-i="presets"></h2></div>
    <div class="pgrid" id="presets"></div>
  </section>

  <section class="sec">
    <div class="row-h"><h2 data-i="favs"></h2></div>
    <div id="favs"></div>
  </section>

  <p class="foot" data-i="privacy"></p>
</div>

<div class="back" id="back"></div>

<div class="sheet" id="sh-settings" role="dialog" aria-modal="true">
  <h3 data-i="settings"></h3>
  <div class="srow"><span data-i="theme"></span><div class="seg" id="themeSeg"></div></div>
  <div class="srow"><span data-i="lang"></span><select id="langSel"></select></div>
  <div class="srow"><span data-i="autoDim"></span><button class="sw" id="dimSw"></button></div>
  <p class="sml" data-i="privacy"></p>
  <div class="btns"><button class="btn" data-close data-i="close"></button></div>
</div>

<div class="sheet" id="sh-save" role="dialog" aria-modal="true">
  <h3 data-i="mixName"></h3>
  <input class="txt" id="mixName" type="text" maxlength="40" autocomplete="off">
  <div class="btns"><button class="btn" data-close data-i="cancel"></button><button class="btn pri" id="doSave" data-i="save"></button></div>
</div>

<div class="sheet" id="sh-confirm" role="dialog" aria-modal="true">
  <h3 id="cfText"></h3>
  <div class="btns"><button class="btn" data-close data-i="cancel"></button><button class="btn dan" id="cfYes" data-i="del"></button></div>
</div>

<div class="sheet" id="sh-rate" role="dialog" aria-modal="true">
  <h3 data-i="rateT"></h3>
  <p data-i="rateX"></p>
  <div class="btns"><button class="btn" data-close data-i="rateN"></button><button class="btn pri" id="rateYes" data-i="rateY"></button></div>
</div>

<div id="night" role="button" tabindex="-1">
  <div class="clock" id="clock"></div>
  <div class="ndot" id="ndot"></div>
  <div class="ntimer" id="ntimer"></div>
  <div class="nhint" id="nhint"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="app-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><mask id="cm"><rect width="512" height="512" fill="#fff"/><circle cx="300" cy="214" r="104" fill="#000"/></mask></defs><rect width="512" height="512" rx="112" fill="#0c1020"/><circle cx="256" cy="256" r="196" fill="none" stroke="#9ad8c8" stroke-opacity=".22" stroke-width="14"/><circle cx="256" cy="256" r="150" fill="none" stroke="#9ad8c8" stroke-opacity=".5" stroke-width="14"/><circle cx="256" cy="256" r="112" fill="#f2c38b" mask="url(#cm)"/></svg></template>

  const rms=Math.sqrt(ss/(2*(N+F)))||1,k=Math.min(d.rms/rms,.95/(pk||1));
  const b=A.ctx.createBuffer(2,N,sr);
  ch.forEach((a,c)=>{const o=b.getChannelData(c);for(let i=0;i<N;i++){let v=a[i];if(i<F){const g=i/F*Math.PI/2;v=a[N+i]*Math.cos(g)+a[i]*Math.sin(g)}o[i]=v*k}});
  return A.buf[id]=b;
}
function startLayer(id,v){
  if(!A.ctx||A.nodes[id])return;
  try{
    const b=getBuf(id),src=A.ctx.createBufferSource(),g=A.ctx.createGain();
    src.buffer=b;src.loop=true;g.gain.value=0;src.connect(g);g.connect(A.master);
    src.start(0,Math.random()*b.duration);g.gain.setTargetAtTime(v*v,A.ctx.currentTime,.2);
    A.nodes[id]={src,g};
  }catch(e){}
}
function stopLayer(id){
  const n=A.nodes[id];if(!n)return;delete A.nodes[id];
  const now=A.ctx.currentTime;
  try{n.g.gain.cancelScheduledValues(now);n.g.gain.setTargetAtTime(0,now,.08);n.src.stop(now+.6)}catch(e){}
}
function setVol(id,v){const n=A.nodes[id];if(n&&A.ctx)n.g.gain.setTargetAtTime(v*v,A.ctx.currentTime,.05)}
function fadeGain(){if(!R.endAt)return 1;const rem=R.endAt-Date.now();return rem>=FADE?1:Math.max(0,rem/FADE)**2}
function applyOut(tc){if(!A.ctx)return;const g=A.out.gain,now=A.ctx.currentTime;g.cancelScheduledValues(now);g.setTargetAtTime(R.playing?fadeGain():0,now,tc)}

function play(){
  if(!S.layers.length){toast(t("empty"));return}
  if(!ensureCtx())return;
  clearTimeout(R.susT);
  R.playing=true;
  try{const p=A.ctx.resume();if(p&&p.catch)p.catch(()=>{})}catch(e){}
  for(const id in A.nodes)if(!S.layers.some(l=>l.id===id))stopLayer(id);
  S.layers.forEach(l=>{if(A.nodes[l.id])setVol(l.id,l.v);else startLayer(l.id,l.v)});
  if(S.timerMin){if(R.remain==null)R.remain=S.timerMin*60000;R.endAt=Date.now()+R.remain}
  R.lastTick=Date.now();
  applyOut(.25);renderPlay();renderTimer();
}
function pause(){
  R.playing=false;
  if(R.endAt){R.remain=Math.max(0,R.endAt-Date.now());R.endAt=null}
  if(A.ctx){applyOut(.08);clearTimeout(R.susT);R.susT=setTimeout(()=>{if(!R.playing&&A.ctx){try{const p=A.ctx.suspend();if(p&&p.catch)p.catch(()=>{})}catch(e){}}},600)}
  renderPlay();renderTimer();
}
function countSession(){if(R.counted)return;R.counted=true;S.sessions++;save()}
function finish(){
  R.endAt=null;R.remain=null;pause();countSession();
  toast(t("done"));ad("timer_end");setTimeout(maybeRate,1500);
}
function ad(place){const now=Date.now();if(now-R.lastAd<180000)return;R.lastAd=now;try{window.APP_AD(place)}catch(e){}}
function maybeRate(){if(S.sessions>=3&&!S.rated&&!R.sheet&&!R.night&&!R.playing){S.rated=true;save();openSheet("rate")}}

/* ---------- mix actions ---------- */
function toggleSound(id){
  const i=S.layers.findIndex(l=>l.id===id);
  if(i>=0){S.layers.splice(i,1);stopLayer(id);if(!S.layers.length&&R.playing)pause()}
  else{
    if(S.layers.length>=3){const old=S.layers.shift();stopLayer(old.id);toast(t("maxThree"))}
    S.layers.push({id,v:.7});
    if(R.playing)startLayer(id,.7);else play();
  }
  save();renderLayers();updateGrid();
}
function setMix(list,timer){
  S.layers=cleanLayers(list);
  if(timer!==undefined&&TIMERS.includes(timer)){S.timerMin=timer;R.remain=null;R.endAt=null}
  save();renderLayers();updateGrid();updateChips();
  play();
}
function selectTimer(m){
  S.timerMin=m;R.remain=m?m*60000:null;R.endAt=m&&R.playing?Date.now()+R.remain:null;
  if(R.playing)applyOut(.3);
  save();updateChips();renderTimer();
}

/* ---------- rendering ---------- */
function applyTexts(){
  document.documentElement.lang=L;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $("#setBtn").innerHTML=icon(IC.set);$("#setBtn").setAttribute("aria-label",t("settings"));
  $("#nightBtn").innerHTML=icon(IC.moon);$("#nightBtn").setAttribute("aria-label",t("night"));
  $("#saveBtn").innerHTML=icon(IC.save)+"<span>"+esc(t("saveMix"))+"</span>";
  $("#nhint").textContent=t("wake");
  $("#chips").innerHTML=TIMERS.map(m=>`<button class="chip" data-m="${m}">${m?m+" "+esc(t("min")):esc(t("off"))}</button>`).join("");
  $("#grid").innerHTML=SL.map(d=>`<button class="tile" data-s="${d.id}">${icon(IC[d.id])}<span>${esc(sn(d.id))}</span></button>`).join("");
  $("#presets").innerHTML=PRESETS.map((p,i)=>`<button class="preset" data-p="${i}"><span class="ics">${p.slice(0,2).map(x=>icon(IC[x[0]])).join("")}</span><span>${esc(I18N[L].p[i])}</span></button>`).join("");
  $("#themeSeg").innerHTML=["auto","dark","light"].map(m=>`<button data-th="${m}">${esc(t(m))}</button>`).join("");
  $("#langSel").innerHTML=`<option value="">${esc(t("auto"))} · ${LANG_NAMES[detect()]}</option>`+Object.keys(LANG_NAMES).map(k=>`<option value="${k}">${LANG_NAMES[k]}</option>`).join("");
  $("#langSel").value=S.lang;
  updateChips();updateGrid();renderLayers();renderFavs();renderPlay();renderTimer();renderSettings();
}
function updateChips(){document.querySelectorAll("#chips .chip").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.m===S.timerMin))}
function updateGrid(){document.querySelectorAll("#grid .tile").forEach(b=>b.setAttribute("aria-pressed",S.layers.some(l=>l.id===b.dataset.s)))}
function renderLayers(){
  $("#layers").innerHTML=S.layers.map(l=>`<div class="layer"><span class="li">${icon(IC[l.id])}</span><div class="lm"><div class="ln">${esc(sn(l.id))}</div><input type="range" min="0" max="100" value="${Math.round(l.v*100)}" data-v="${l.id}" style="--p:${Math.round(l.v*100)}%" aria-label="${esc(sn(l.id))}"></div><button class="x" data-rm="${l.id}" aria-label="${esc(t("remove"))} ${esc(sn(l.id))}">${icon(IC.x)}</button></div>`).join("");
  $("#hint").textContent=S.layers.length?(S.layers.length<3?t("hint"):""):t("empty");
  $("#hint").style.display=$("#hint").textContent?"":"none";
  $("#status").textContent=S.layers.length?S.layers.map(l=>sn(l.id)).join(" · "):t("empty");
}
function renderPlay(){const b=$("#playBtn");b.innerHTML=icon(R.playing?IC.pause:IC.play,"f");b.setAttribute("aria-label",t(R.playing?"pause":"play"))}
function timerText(){
  if(!S.timerMin)return"";
  const rem=R.endAt?R.endAt-Date.now():(R.remain!=null?R.remain:S.timerMin*60000);
  return R.endAt&&rem<FADE?t("fading",{t:fmt(rem)}):t("stopsIn",{t:fmt(rem)});
}
function renderTimer(){const s=timerText();$("#tleft").textContent=s;if(R.night)$("#ntimer").textContent=s}
function renderFavs(){
  const el=$("#favs");
  if(!S.favs.length){el.innerHTML=`<div class="empty">${esc(t("noFavs"))}</div>`;return}
  el.innerHTML=S.favs.map(f=>`<div class="fav"><button class="fm" data-load="${f.id}"><span class="fn">${esc(f.name)}</span><span class="fs">${f.layers.map(l=>icon(IC[l.id])).join("")}${f.timer?"<span>· "+f.timer+" "+esc(t("min"))+"</span>":""}</span></button><button class="x" data-del="${f.id}" aria-label="${esc(t("del"))}">${icon(IC.x)}</button></div>`).join("");
}
function renderSettings(){
  document.querySelectorAll("#themeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.th===S.theme));
  $("#dimSw").setAttribute("aria-pressed",S.autoDim);$("#dimSw").setAttribute("aria-label",t("autoDim"));
}
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("on");clearTimeout(R.toastT);R.toastT=setTimeout(()=>el.classList.remove("on"),2600)}

/* ---------- theme ---------- */
const C={acc:"#9ad8c8",warm:"#f2c38b"};
const mqLight=window.matchMedia?matchMedia("(prefers-color-scheme: light)"):null;
const mqReduce=window.matchMedia?matchMedia("(prefers-reduced-motion: reduce)"):null;
function applyTheme(){
  const mode=S.theme==="auto"?(mqLight&&mqLight.matches?"light":"dark"):S.theme;
  document.documentElement.dataset.theme=mode;
  const cs=getComputedStyle(document.documentElement);
  C.acc=cs.getPropertyValue("--acc").trim()||C.acc;C.warm=cs.getPropertyValue("--warm").trim()||C.warm;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",cs.getPropertyValue("--bg").trim());
}
if(mqLight){const f=()=>{if(S.theme==="auto")applyTheme()};mqLight.addEventListener?mqLight.addEventListener("change",f):mqLight.addListener&&mqLight.addListener(f)}
function rgba(h,a){h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

/* ---------- sheets & night ---------- */
function openSheet(name){
  closeSheet();R.sheet=name;
  $("#sh-"+name).classList.add("on");$("#back").classList.add("on");
}
function closeSheet(){if(!R.sheet)return;$("#sh-"+R.sheet).classList.remove("on");$("#back").classList.remove("on");R.sheet=null}
function openNight(){
  closeSheet();R.night=true;$("#night").classList.add("on");tickNight();
  const h=$("#nhint");h.style.opacity=1;clearTimeout(R.hintT);R.hintT=setTimeout(()=>h.style.opacity=0,4000);
}
function closeNight(){if(!R.night)return;R.night=false;$("#night").classList.remove("on");R.lastInput=Date.now();if(!R.playing)setTimeout(maybeRate,400)}
function tickNight(){
  if(!R.night)return;
  let s;try{s=new Date().toLocaleTimeString(L,{hour:"2-digit",minute:"2-digit"})}catch(e){const d=new Date();s=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}
  $("#clock").textContent=s;$("#ntimer").textContent=timerText();
}

/* ---------- breathing orb ---------- */
const cv=$("#orb"),cx=cv.getContext("2d");let CW=0,CH=0,DPR=1;
function sizeCv(){DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.max(1,Math.round(CW*DPR));cv.height=Math.max(1,Math.round(CH*DPR))}
function frame(ts){
  let target=0;
  if(R.playing&&A.an){A.an.getFloatTimeDomainData(A.td);let s=0;for(let i=0;i<A.td.length;i++)s+=A.td[i]*A.td[i];target=Math.min(1,Math.sqrt(s/A.td.length)*4.5)}
  R.lv+=(target-R.lv)*(target>R.lv?.08:.03);
  R.on+=((R.playing?1:0)-R.on)*.05;
  const red=mqReduce&&mqReduce.matches,rm=red?.35:1;
  const br=.5-.5*Math.cos(TAU*ts/(R.playing?6500:9000));
  if(!R.night&&CW){
    const base=Math.min(CW,CH)*.29,r=base*(.92+.06*br*rm+.16*R.lv*rm);
    cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,CW,CH);cx.translate(CW/2,CH/2-6);
    if(!red&&R.on>.02){cx.lineWidth=1.5;for(let k=0;k<3;k++){const p=(ts/5200+k/3)%1;cx.strokeStyle=rgba(C.acc,(1-p)*.22*R.on);cx.beginPath();cx.arc(0,0,r*(1.05+p*.75),0,TAU);cx.stroke()}}
    let g=cx.createRadialGradient(0,0,r*.6,0,0,r*1.6);g.addColorStop(0,rgba(C.acc,.16*(.35+.65*R.on)));g.addColorStop(1,rgba(C.acc,0));
    cx.fillStyle=g;cx.beginPath();cx.arc(0,0,r*1.6,0,TAU);cx.fill();
    const wob=(.012+.05*R.lv)*rm*(.3+.7*R.on);
    cx.beginPath();
    for(let i=0;i<=64;i++){const th=i/64*TAU,d=1+wob*(Math.sin(3*th+ts*.0007)*.5+Math.sin(5*th-ts*.0011)*.3+Math.sin(2*th+ts*.0004)*.2),x=Math.cos(th)*r*d,y=Math.sin(th)*r*d;i?cx.lineTo(x,y):cx.moveTo(x,y)}
    cx.closePath();
    g=cx.createRadialGradient(-r*.3,-r*.35,r*.05,0,0,r*1.05);
    g.addColorStop(0,rgba(C.warm,.95));g.addColorStop(.65,rgba(C.acc,.85));g.addColorStop(1,rgba(C.acc,.5));
    cx.globalAlpha=.45+.55*R.on;cx.fillStyle=g;cx.fill();cx.globalAlpha=1;
  }else if(R.night){$("#ndot").style.transform=`scale(${.8+.3*br*rm+.5*R.lv})`}
  requestAnimationFrame(frame);
}

/* ---------- events ---------- */
$("#playBtn").addEventListener("click",()=>{if(R.playing){pause();maybeRate()}else play()});
$("#nightBtn").addEventListener("click",openNight);
$("#setBtn").addEventListener("click",()=>{renderSettings();openSheet("settings")});
$("#saveBtn").addEventListener("click",()=>{
  if(!S.layers.length){toast(t("empty"));return}
  $("#mixName").value=S.layers.map(l=>sn(l.id)).join(" + ").slice(0,40);
  openSheet("save");
});
$("#doSave").addEventListener("click",()=>{
  const name=($("#mixName").value||"").trim().slice(0,40)||S.layers.map(l=>sn(l.id)).join(" + ").slice(0,40);
  S.favs.unshift({id:Date.now(),name,layers:S.layers.map(l=>({id:l.id,v:l.v})),timer:S.timerMin});
  S.favs=S.favs.slice(0,30);save();renderFavs();closeSheet();toast(t("saved"));ad("saved");
});
$("#mixName").addEventListener("keydown",e=>{if(e.key==="Enter")$("#doSave").click()});
$("#cfYes").addEventListener("click",()=>{const f=R.cf;R.cf=null;closeSheet();if(f)f()});
$("#rateYes").addEventListener("click",()=>{closeSheet();try{if(typeof window.APP_RATE==="function")window.APP_RATE()}catch(e){}});
$("#back").addEventListener("click",closeSheet);
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeSheet));
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b)selectTimer(+b.dataset.m)});
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".tile");if(b)toggleSound(b.dataset.s)});
$("#presets").addEventListener("click",e=>{const b=e.target.closest(".preset");if(b)setMix(PRESETS[+b.dataset.p].map(x=>({id:x[0],v:x[1]})))});
$("#layers").addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(b)toggleSound(b.dataset.rm)});
$("#layers").addEventListener("input",e=>{
  const el=e.target;if(!el.dataset||!el.dataset.v)return;
  const l=S.layers.find(x=>x.id===el.dataset.v);if(!l)return;
  l.v=clamp(el.value/100,0,1);el.style.setProperty("--p",el.value+"%");setVol(l.id,l.v);
  clearTimeout(R.svT);R.svT=setTimeout(save,300);
});
$("#favs").addEventListener("click",e=>{
  const ld=e.target.closest("[data-load]"),dl=e.target.closest("[data-del]");
  if(ld){const f=S.favs.find(x=>String(x.id)===ld.dataset.load);if(f)setMix(f.layers,f.timer)}
  else if(dl){const f=S.favs.find(x=>String(x.id)===dl.dataset.del);if(!f)return;
    $("#cfText").textContent=t("delQ",{n:f.name});
    R.cf=()=>{S.favs=S.favs.filter(x=>x!==f);save();renderFavs()};openSheet("confirm")}
});
$("#themeSeg").addEventListener("click",e=>{const b=e.target.closest("[data-th]");if(!b)return;S.theme=b.dataset.th;save();applyTheme();renderSettings()});
$("#langSel").addEventListener("change",e=>{S.lang=e.target.value;L=S.lang||detect();save();applyTexts()});
$("#dimSw").addEventListener("click",()=>{S.autoDim=!S.autoDim;save();renderSettings()});
$("#night").addEventListener("click",closeNight);
const markInput=()=>{R.lastInput=Date.now()};
["pointerdown","keydown","touchstart","wheel"].forEach(ev=>document.addEventListener(ev,markInput,{capture:true,passive:true}));
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(R.night)closeNight();else closeSheet()}
  else if(e.key===" "&&!R.sheet&&e.target===document.body){e.preventDefault();$("#playBtn").click()}
});
window.addEventListener("resize",sizeCv);

setInterval(()=>{
  const now=Date.now();
  if(R.playing){
    R.played+=Math.min(5000,now-R.lastTick);
    if(R.played>600000)countSession();
    if(R.endAt){if(now>=R.endAt)finish();else applyOut(.4)}
    if(S.autoDim&&!R.night&&!R.sheet&&now-R.lastInput>45000)openNight();
  }
  R.lastTick=now;renderTimer();tickNight();
},500);

/* ---------- start ---------- */
applyTheme();applyTexts();sizeCv();save();
requestAnimationFrame(frame);
</script>
