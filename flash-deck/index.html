function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,3500)}
function theme(){if(state.theme==='auto')delete document.body.dataset.theme;else document.body.dataset.theme=state.theme;document.documentElement.lang=state.lang;$('#settings').setAttribute('aria-label',t('settings'))}
const btn=(k,a,cls='')=>`<button class="${cls}" data-act="${a}">${esc(t(k))}</button>`,due=d=>d.cards.filter(c=>c.due<=day()).length,pct=d=>d.cards.length?Math.round(d.cards.reduce((s,c)=>s+c.box-1,0)/(d.cards.length*4)*100):0,current=()=>state.decks.find(d=>d.id===selected);
function render(){theme();let a=$('#app');if(view==='home'){let n=state.decks.reduce((s,d)=>s+due(d),0);a.innerHTML=`<section class="hero"><div><div class="eyebrow muted">${t('eyebrow')}</div><h1>${t('headline')}</h1><p class="muted">${t('intro')}</p></div><div class="today"><div class="eyebrow">${t('today')}</div><strong>${n}</strong><div class="stack" aria-hidden="true"></div><div>${t(n?'cards':'allClear')}</div><button data-act="daily" ${n?'':'disabled'}>${t('review')} ↗</button></div></section><div class="row"><h2>${t('decks')} <span class="muted">/ ${state.decks.length}</span></h2>${btn('newDeck','new','primary')}</div><div class="grid">${state.decks.map((d,i)=>`<article class="deck" style="border-top-color:${['#bd6545','#96a663','#a991b5','#699d9b'][i%4]}"><span class="tag">${due(d)} ${t('due')}</span><h3>${esc(d.name)}</h3><div class="muted">${d.cards.length} ${t('cards')}</div><div class="bar"><i style="width:${pct(d)}%"></i></div><div class="row hint"><span>${t('progress')}</span><span>${pct(d)}%</span></div><div class="actions"><button data-open="${d.id}">${t('open')} ↗</button><button data-study="${d.id}" aria-label="${t('study')}">▷</button></div></article>`).join('')}</div>${state.decks.length?'':`<p class="empty">${t('empty')}</p>`}`}
else if(view==='deck'){let d=current();if(!d){view='home';return render()}a.innerHTML=`<div class="row" style="margin-top:22px">${btn('backHome','home')}<div class="actions">${btn('rename','rename')}${btn('delete','deleteDeck','danger')}</div></div><section class="panel"><div class="eyebrow muted">${d.cards.length} ${t('cards')} · ${due(d)} ${t('today')}</div><h1>${esc(d.name)}</h1><div class="bar"><i style="width:${pct(d)}%"></i></div><div class="row"><span>${t('progress')} ${pct(d)}%</span>${btn('study','choose','primary')}</div><div class="boxes">${[1,2,3,4,5].map(n=>`<div class="box"><small>${t('box')} ${n}</small><b>${d.cards.filter(c=>c.box===n).length}</b></div>`).join('')}</div><p class="hint">${t('scheduleHint')}</p></section><div class="actions">${btn('addCards','add','primary')}${btn('bulk','bulk')}${btn('import','import')}${btn('export','export')}</div><label for="search">${t('search')}</label><input id="search" type="search"><div id="cardList"></div>`;list('')}
else if(view==='study')renderStudy();else if(view==='result')$('#app').innerHTML=`<section class="study panel center"><div style="font-size:64px">✓</div><div class="eyebrow">${t('done')}</div><h1>${t('complete')}</h1><p>${t('session')}: <b>${session.mode==='browse'?session.index+1:session.reviewed}</b></p>${session.reviewed?`<p class="muted">${t('correct')}: ${session.correct} / ${session.reviewed}</p>`:''}${btn('home','home','primary wide')}</section>`;save()}
function list(q){let cards=current().cards.filter(c=>(c.front+' '+c.back).toLocaleLowerCase().includes(q.toLocaleLowerCase()));$('#cardList').innerHTML=cards.map(c=>`<article class="card-row"><div><p><b>${esc(c.front)}</b></p><p class="muted">${esc(c.back)}</p><small class="hint">${t('box')} ${c.box}</small></div><button data-edit="${c.id}" aria-label="${t('edit')}">✎</button><button data-remove="${c.id}" class="danger" aria-label="${t('delete')}">×</button></article>`).join('')||`<p class="empty">${t(q?'noMatch':'noCards')}</p>`}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal()}function close(){$('#modal').close()}
function nameForm(rename=false){modal(`<form id="nameForm"><h2>${t(rename?'rename':'newDeck')}</h2><label for="deckName">${t('name')}</label><input id="deckName" maxlength="90" required value="${rename?esc(current().name):''}"><div class="controls"><button class="primary">${t('save')}</button><button type="button" data-act="close">${t('cancel')}</button></div></form>`);$('#nameForm').onsubmit=e=>{e.preventDefault();let name=$('#deckName').value.trim();if(!name)return;if(rename)current().name=name;else{let d={id:uid(),name,cards:[]};state.decks.push(d);selected=d.id;view='deck'}close();render();toast(t('saved'))}}
function cardForm(id){let c=id?current().cards.find(c=>c.id===id):null;modal(`<form id="cardForm"><h2>${t(c?'edit':'addCards')}</h2><label for="front">${t('front')}</label><textarea id="front" required maxlength="5000">${c?esc(c.front):''}</textarea><label for="back">${t('back')}</label><textarea id="back" required maxlength="5000">${c?esc(c.back):''}</textarea><div class="controls"><button class="primary">${t('save')}</button><button type="button" data-act="close">${t('cancel')}</button></div></form>`);$('#cardForm').onsubmit=e=>{e.preventDefault();let f=$('#front').value.trim(),b=$('#back').value.trim();if(!f||!b)return toast(t('invalid'));if(c){c.front=f;c.back=b;c.box=1;c.due=day();c.reviews=0}else current().cards.push(card(f,b));close();render();toast(t('saved'))}}
function bulk(){modal(`<form id="bulkForm"><h2>${t('bulk')}</h2><p class="hint">${t('bulkHint')}</p><textarea id="pairs" required placeholder="hola — hello&#10;gracias — thank you"></textarea><p id="bulkError" role="status" class="danger"></p><div class="controls"><button class="primary">${t('add')}</button><button type="button" data-act="close">${t('cancel')}</button></div></form>`);$('#bulkForm').onsubmit=e=>{e.preventDefault();let lines=$('#pairs').value.split(/\r?\n/).filter(s=>s.trim()),pairs=lines.map(s=>s.split(/\s*[—–=\t]\s*|\s+-\s+/));if(!lines.length||pairs.some(p=>p.length<2||!p[0].trim()||!p.slice(1).join(' — ').trim())){$('#bulkError').textContent=t('badLines');return}current().cards.push(...pairs.map(p=>card(p[0].trim(),p.slice(1).join(' — ').trim())));close();render();toast(t('saved'))}}
function choose(all=false){if(!all&&!current().cards.length)return toast(t('noCards'));modal(`<h2>${t('mode')}</h2><p class="hint">${t('countHint')}</p><div style="display:grid;gap:12px">${['browse','self','type'].map(m=>`<button data-mode="${m}" data-all="${all}">${t(m)} ↗</button>`).join('')}</div><p class="hint">${t('scheduleHint')}</p>${btn('close','close','wide')}`)}
function start(mode,all){let decks=all?state.decks:[current()],refs=decks.flatMap(d=>d.cards.filter(c=>mode==='browse'||c.due<=day()).map(c=>({d:d.id,c:c.id})));if(!refs.length)refs=decks.flatMap(d=>d.cards.map(c=>({d:d.id,c:c.id})));if(!refs.length){close();return toast(t('noCards'))}session={mode,refs,index:0,revealed:false,checked:false,reviewed:0,correct:0,graded:{}};close();view='study';render()}
function sc(){let r=session.refs[session.index];return state.decks.find(d=>d.id===r.d).cards.find(c=>c.id===r.c)}
function renderStudy(){let s=session,c=sc(),n=s.refs.length;$('#app').innerHTML=`<section class="study"><div class="row">${btn('backHome','exit')}<span class="eyebrow muted">${t(s.mode)}</span></div><div class="row" style="margin-top:24px"><b>${s.index+1} / ${n}</b><span class="muted">${n-s.index} ${t('remaining')}</span></div><div class="bar"><i style="width:${s.index/n*100}%"></i></div><div class="stage"><button id="flash" class="flash ${s.revealed?'flipped':''}" data-act="flip" aria-label="${t('flip')}" ${s.mode==='type'&&!s.checked?'disabled':''}><span class="flipper"><span class="face"><span class="eyebrow muted">${t('front')}</span><span class="word">${esc(c.front)}</span><span class="hint">${t(s.mode==='type'?'type':'flip')} ↻</span></span><span class="face back"><span class="eyebrow">${t('back')}</span><span class="word">${esc(c.back)}</span><span class="hint">${t('box')} ${c.box}</span></span></span></button></div>${s.mode==='type'?`<form id="answerForm"><label for="answer">${t('answer')}</label><input id="answer" autocomplete="off"><button class="primary wide" style="margin-top:12px">${t('check')}</button></form><div id="feedback" role="status"></div><div id="typedNext" hidden>${btn('next','next','primary wide')}</div>`:s.mode==='self'?`<div class="controls" id="gradeControls">${s.revealed?btn('again','wrong')+btn('known','right','primary'):btn('flip','flip','primary')}</div>`:`<div class="controls"><button data-act="previous" ${s.index===0?'disabled':''}>${t('previous')}</button>${btn(s.index===n-1?'done':'next','next','primary')}</div>`}<p class="hint center">${t('countHint')}</p><div class="center">${btn('finish','finish')}</div></section>`;if(s.mode==='type')$('#answerForm').onsubmit=e=>{e.preventDefault();checkAnswer()}}
function flip(){session.revealed=!session.revealed;$('#flash').classList.toggle('flipped',session.revealed);if(session.mode==='self')$('#gradeControls').innerHTML=session.revealed?btn('again','wrong')+btn('known','right','primary'):btn('flip','flip','primary')}
function grade(ok){let s=session,c=sc();if(s.graded[c.id])return;s.graded[c.id]=true;c.box=ok?Math.min(5,c.box+1):1;c.due=day()+[1,2,4,8,16][c.box-1];c.reviews++;s.reviewed++;if(ok)s.correct++;save()}
function checkAnswer(){if(session.checked)return;let val=$('#answer').value.trim();if(!val)return;let norm=x=>x.normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase(state.lang),ok=norm(val)===norm(sc().back);session.checked=true;grade(ok);flip();$('#flash').disabled=false;$('#answer').disabled=true;$('#answerForm button').hidden=true;$('#feedback').className='feedback';$('#feedback').textContent=t(ok?'correct':'incorrect')+(ok?' ✓':' · '+sc().back);$('#typedNext').hidden=false}
function next(){if(session.index+1===session.refs.length)return finish();session.index++;session.revealed=false;session.checked=false;renderStudy()}
function finish(){view='result';if(session.reviewed){state.sessions++;state.history.unshift({date:day(),count:session.reviewed,correct:session.correct});state.history=state.history.slice(0,100)}render();if(Date.now()-lastAd>=180000){window.APP_AD('session_complete');lastAd=Date.now()}if(state.sessions===3&&!state.rated&&session.reviewed){state.rated=true;save();modal(`<h2>${t('rating')}</h2><div class="controls">${btn('rateThanks','rated','primary')}${btn('rateLater','close')}</div>`)}}
function settings(){modal(`<h2>${t('settings')}</h2><label for="lang">${t('language')}</label><select id="lang">${Object.entries({en:'English',es:'Español',pt:'Português',de:'Deutsch',fr:'Français',it:'Italiano',tr:'Türkçe',id:'Bahasa Indonesia'}).map(([k,v])=>`<option value="${k}" ${state.lang===k?'selected':''}>${v}</option>`).join('')}</select><label for="theme">${t('theme')}</label><select id="theme">${['auto','light','dark'].map(k=>`<option value="${k}" ${state.theme===k?'selected':''}>${t(k)}</option>`).join('')}</select><p class="hint">${t('privacy')}</p>${btn('close','close','wide')}`);$('#lang').onchange=e=>{state.lang=e.target.value;render();close();settings()};$('#theme').onchange=e=>{state.theme=e.target.value;theme();save()}}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else if(quoted)quoted=false;else if(!field)quoted=true;else throw Error('csv')}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('csv');row.push(field);if(row.some(v=>v.trim()))rows.push(row);if(rows.length&&/^(front|word|term)$/i.test(rows[0][0].trim())&&/^(back|translation|definition)$/i.test((rows[0][1]||'').trim()))rows.shift();if(!rows.length||rows.some(r=>r.length!==2||r.some(v=>!v.trim()||v.length>5000)))throw Error('csv');return rows}
$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>1500000)throw Error('size');let rows=parseCSV(await f.text());if(!current())return;current().cards.push(...rows.map(r=>card(r[0].trim(),r[1].trim())));render();toast(rows.length+' '+t('imported'))}catch(e){toast(t('csvHint'))}finally{$('#file').value=''}};
function exportCSV(){let d=current(),quote=s=>'"'+s.replace(/"/g,'""')+'"',csv='\uFEFFfront,back\r\n'+d.cards.map(c=>[c.front,c.back].map(quote).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=d.name.replace(/[^\p{L}\p{N} _-]/gu,'_')+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('input',e=>{if(e.target.id==='search')list(e.target.value)});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.open){selected=b.dataset.open;view='deck';render()}else if(b.dataset.study){selected=b.dataset.study;choose()}else if(b.dataset.edit)cardForm(b.dataset.edit);else if(b.dataset.remove){let id=b.dataset.remove;modal(`<h2>${t('delete')}?</h2><p>${esc(current().cards.find(c=>c.id===id).front)}</p><div class="controls"><button class="danger" data-delete-card="${id}">${t('delete')}</button>${btn('cancel','close')}</div>`)}else if(b.dataset.deleteCard){current().cards=current().cards.filter(c=>c.id!==b.dataset.deleteCard);close();render();toast(t('removed'))}else if(b.dataset.mode)start(b.dataset.mode,b.dataset.all==='true');else switch(b.dataset.act){case'new':nameForm();break;case'rename':nameForm(true);break;case'home':view='home';session=null;selected=null;render();break;case'close':close();break;case'add':cardForm();break;case'bulk':bulk();break;case'choose':choose();break;case'daily':choose(true);break;case'flip':flip();break;case'right':grade(true);next();break;case'wrong':grade(false);next();break;case'next':next();break;case'previous':session.index--;session.revealed=false;renderStudy();break;case'finish':finish();break;case'exit':view=selected?'deck':'home';session=null;render();break;case'import':$('#file').click();break;case'export':exportCSV();break;case'deleteDeck':modal(`<h2>${t('deleteDeck')}</h2><p>${t('deleteHint')}</p><div class="controls">${btn('delete','removeDeck','danger')}${btn('cancel','close')}</div>`);break;case'removeDeck':state.decks=state.decks.filter(d=>d.id!==selected);selected=null;view='home';close();render();break;case'rated':close();toast(t('rated'));break}});
$('#settings').onclick=settings;document.querySelector('link[rel=icon]').href='data:image/svg+xml,'+encodeURIComponent($('#app-icon').innerHTML.trim());render();
