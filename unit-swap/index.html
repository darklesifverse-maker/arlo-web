function favorites(){ $('favorites').replaceChildren(...state.favorites.map((x,i)=>{let row=document.createElement('div');row.className='favorite';let b=document.createElement('button');b.className='load';b.textContent=UNITS[x.cat][x.from][0]+' → '+UNITS[x.cat][x.to][0];let small=document.createElement('small');small.textContent=t('cats')[CATS.indexOf(x.cat)]+(x.cat==='kitchen'?' · '+t('ingredients')[x.ingredient]:'');b.append(small);b.onclick=()=>restore(x);let remove=document.createElement('button');remove.className='icon';remove.textContent='×';remove.setAttribute('aria-label',t('remove'));remove.onclick=()=>{state.favorites.splice(i,1);persist();favorites();star();notify('removed');};row.append(b,remove);return row;}));}
