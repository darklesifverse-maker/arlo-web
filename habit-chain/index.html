};
const STORE='chain-habits-v1';
let data={habits:[],language:'auto',theme:'system'}, available=true, active='', selected='', shown=new Date();
const $=id=>document.getElementById(id), escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, today=()=>key(new Date()), date=s=>new Date(s+'T12:00:00');
function valid(v){return v&&Array.isArray(v.habits)&&v.habits.length<=12&&['auto',...Object.keys(I18N)].includes(v.language)&&['system','light','dark'].includes(v.theme)&&v.habits.every(h=>h&&typeof h.id==='string'&&typeof h.name==='string'&&h.name.trim()&&h.name.length<=60&&['daily','alternate','weekly'].includes(h.schedule)&&/^#[a-f0-9]{6}$/i.test(h.color)&&/^\d{4}-\d{2}-\d{2}$/.test(h.start)&&Number.isFinite(+date(h.start))&&h.marks&&typeof h.marks==='object'&&!Array.isArray(h.marks)&&h.notes&&typeof h.notes==='object'&&!Array.isArray(h.notes)&&Object.entries(h.notes).every(([k,v])=>typeof v==='string'&&v.length<=2000))}
try{const v=JSON.parse(localStorage.getItem(STORE));if(valid(v))data=v}catch{available=false}
function language(){const l=(navigator.language||'en').toLowerCase().split('-')[0];return data.language==='auto'?(I18N[l]?l:'en'):data.language}
const t=k=>I18N[language()][k]||I18N.en[k];
function save(){try{localStorage.setItem(STORE,JSON.stringify(data));available=true}catch{available=false}}
function message(k){$('toast').textContent=t(k);$('toast').classList.remove('hidden');clearTimeout(message.timer);message.timer=setTimeout(()=>$('toast').classList.add('hidden'),3000)}
const btn=(a,label,extra='',cls='')=>`<button type="button" data-action="${a}" class="${cls}" ${extra}>${label}</button>`;
function due(h,d){return h.schedule!=='alternate'||Math.round((date(d)-date(h.start))/86400000)%2===0}
function week(d){const x=date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return key(x)}
function stats(h){let run=0,best=0;const end=today();if(h.schedule==='weekly'){for(let d=date(week(h.start));key(d)<=week(end);d.setDate(d.getDate()+7)){const w=key(d),count=Object.keys(h.marks).filter(k=>week(k)===w&&h.marks[k]).length;if(count>=3)run++;else if(w!==week(end))run=0;best=Math.max(best,run)}}else for(let d=date(h.start);key(d)<=end;d.setDate(d.getDate()+1)){const k=key(d);if(!due(h,k))continue;if(h.marks[k])run++;else if(k!==end)run=0;best=Math.max(best,run)}return [run,best,Object.values(h.marks).filter(Boolean).length]}
function render(){document.documentElement.lang=language();document.body.dataset.theme=data.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):data.theme;const done=data.habits.filter(h=>h.marks[today()]).length;
$('app').innerHTML=`<div class="wrap"><header><div class="brand">${$('app-icon').innerHTML}Chain Habits</div>${btn('settings',escape(t('settings')))}</header><section class="hero"><div><small class="eyebrow date">${escape(t('tag'))}</small><h1>${escape(t('headline'))}</h1><p>${escape(t('intro'))}</p></div>${btn('add',escape(t('add')),'','primary')}</section>${available?'':`<p class="notice">${escape(t('storage'))}</p>`}<div class="dashboard"><main class="main"><h2 class="section-title">${escape(t('habits'))} <small>${data.habits.length}/12</small></h2>${data.habits.length?data.habits.map(h=>`<article class="card habit" style="--hc:${h.color}"><div class="habit-top">${btn('toggle',h.marks[today()]?'✓':'+',`data-id="${escape(h.id)}" aria-label="${escape(t(h.marks[today()]?'undo':'mark')+': '+h.name)}" aria-pressed="${!!h.marks[today()]}"`,'check '+(h.marks[today()]?'done':''))}<div class="habit-title"><h3>${escape(h.name)}</h3><small>${escape(t(h.schedule))} · ${stats(h)[0]} ${escape(t(h.schedule==='weekly'?'weekChain':'chain'))}</small></div></div><div class="habit-bottom"><div class="chain" aria-hidden="true">${Array.from({length:10},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i-9);return `<i class="link ${h.marks[key(d)]?'':'off'}"></i>`}).join('')}</div>${btn('details',escape(t('details')),`data-id="${escape(h.id)}"`,'details')}</div></article>`).join(''):`<div class="card empty"><div class="empty-art"><i class="link"></i><i class="link off"></i></div><h2>${escape(t('empty'))}</h2><p>${escape(t('emptyText'))}</p>${btn('add',escape(t('first')),'','primary')}<div class="suggestions">${['read','walk','stretch'].map(k=>btn('suggest',escape(t(k)),`data-key="${k}"`)).join('')}</div></div>`}</main><aside class="aside"><div class="progress-panel"><h3>${escape(t('today'))}</h3><div class="ring" style="--angle:${data.habits.length?360*done/data.habits.length:0}deg"><div class="ring-inner"><strong>${done}/${data.habits.length}</strong><small>${escape(t('done'))}</small></div></div><p>${escape(t(done&&done===data.habits.length?'allDone':'smallStep'))}</p></div><div class="tip"><h3>${escape(t('tip'))}</h3><p>${escape(t('tipText'))}</p></div></aside></div><footer class="footer">${escape(t('privacy'))}</footer></div>`}
let previousFocus;
function modal(title,body){if(!$('overlay').firstChild)previousFocus=document.activeElement;$('overlay').innerHTML=`<div class="dialog-back"><section class="dialog" role="dialog" aria-modal="true" aria-label="${escape(title)}"><div class="dialog-head"><h2>${escape(title)}</h2>${btn('close','×',`aria-label="${escape(t('close'))}"`)}</div>${body}</section></div>`;$('overlay').querySelector('input,select,button')?.focus()}
function close(){ $('overlay').innerHTML='';previousFocus?.focus() }
function editor(id='',name=''){const h=data.habits.find(h=>h.id===id);if(!h&&data.habits.length>=12)return message('limit');active=id;modal(t(h?'edit':'add'),`<form id="habitForm"><label class="field">${escape(t('name'))}<input name="name" required maxlength="60" value="${escape(h?.name||name)}" placeholder="${escape(t('nameHint'))}"></label><label class="field">${escape(t('schedule'))}<select name="schedule">${['daily','alternate','weekly'].map(v=>`<option value="${v}" ${h?.schedule===v?'selected':''}>${escape(t(v))}</option>`).join('')}</select></label><p class="helper">${escape(t('scheduleHelp'))} ${escape(t('weekHelp'))}</p><label class="field">${escape(t('color'))}<input type="color" name="color" value="${h?.color||'#176a55'}"></label><div class="actions">${btn('close',escape(t('cancel')))}<button type="submit" class="primary">${escape(t('save'))}</button></div></form>`)}
function settings(){modal(t('settings'),`<label class="field">${escape(t('language'))}<select id="language">${['auto',...Object.keys(I18N)].map(v=>`<option value="${v}" ${v===data.language?'selected':''}>${escape(v==='auto'?t('system'):({en:'English',es:'Español',pt:'Português',de:'Deutsch',fr:'Français',it:'Italiano',tr:'Türkçe',id:'Bahasa Indonesia'})[v])}</option>`).join('')}</select></label><label class="field">${escape(t('theme'))}<select id="theme">${['system','light','dark'].map(v=>`<option value="${v}" ${v===data.theme?'selected':''}>${escape(t(v))}</option>`).join('')}</select></label><h3>${escape(t('backup'))}</h3><p class="helper">${escape(t('importHelp'))}</p><div class="actions">${btn('export',escape(t('export')))}${btn('import',escape(t('import')))}</div>`)}
function details(){const h=data.habits.find(h=>h.id===active);if(!h)return;const y=shown.getFullYear(),m=shown.getMonth(),days=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7;let cells='';for(let i=0;i<7;i++)cells+=`<div class="weekday">${escape(new Intl.DateTimeFormat(language(),{weekday:'short'}).format(new Date(2024,0,i+1)))}</div>`;cells+='<span></span>'.repeat(offset);for(let i=1;i<=days;i++){const k=key(new Date(y,m,i));cells+=btn('date',String(i),`data-date="${k}" aria-label="${k}" ${k>today()||k<h.start?'disabled':''}`,'day '+(h.marks[k]?'hit ':'')+(k===selected?'selected ':'')+(h.notes[k]?'has-note':''))}let heat='';for(let d=new Date(y,0,1),i=0;d.getFullYear()===y;d.setDate(d.getDate()+1),i++)heat+=`<rect x="${Math.floor(i/7)*6}" y="${i%7*6}" width="5" height="5" rx="1" fill="${h.marks[key(d)]?'var(--green)':'var(--soft)'}"><title>${key(d)}</title></rect>`;const st=stats(h);modal(h.name,`<div class="stats">${['current','best','total'].map((k,i)=>`<div class="stat"><b>${st[i]}</b><small>${escape(t(k))}</small></div>`).join('')}</div><div class="calendar-head">${btn('prev','‹',`aria-label="${escape(t('calendar'))} −"`)}<strong>${escape(new Intl.DateTimeFormat(language(),{month:'long',year:'numeric'}).format(shown))}</strong>${btn('next','›',`aria-label="${escape(t('calendar'))} +"`)}</div><div class="calendar">${cells}</div><p class="helper">${escape(t('dayHelp'))}</p><h3>${escape(t('year'))} · ${y}</h3><svg class="heat" viewBox="0 0 318 42" role="img" aria-label="${escape(t('year'))}">${heat}</svg><div class="note-box"><h3>${selected}</h3>${btn('markDate',escape(t(h.marks[selected]?'undo':'mark')))}<label class="field">${escape(t('note'))}<textarea id="note" maxlength="2000" placeholder="${escape(t('noteHint'))}">${escape(h.notes[selected]||'')}</textarea></label>${btn('saveNote',escape(t('save')))}</div><div class="actions">${btn('edit',escape(t('edit')))}${btn('restart',escape(t('restart')))}${btn('delete',escape(t('remove')),'','danger')}</div>`)}
function mark(h,d,force=false){if(d>today())return message('future');if(d<h.start)return message('before');if(h.marks[d]&&!force)delete h.marks[d];else h.marks[d]=true;save();render()}
window.APP_AD=()=>{};
document.addEventListener('submit',e=>{if(e.target.id!=='habitForm')return;e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(!name||name.length>60)return message('nameError');let h=data.habits.find(h=>h.id===active);if(!h){if(data.habits.length>=12)return message('limit');h={id:globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),start:today(),marks:{},notes:{}};data.habits.push(h)}Object.assign(h,{name,schedule:f.get('schedule'),color:f.get('color')});save();render();close();message('saved')});
document.addEventListener('change',e=>{if(['language','theme'].includes(e.target.id)){data[e.target.id]=e.target.value;save();render();settings()}});
let pending;
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const h=data.habits.find(h=>h.id===(b.dataset.id||active));switch(b.dataset.action){case 'close':close();break;case 'settings':settings();break;case 'add':editor();break;case 'suggest':editor('',t(b.dataset.key));break;case 'toggle':if(h)mark(h,today());break;case 'details':active=h.id;selected=today();shown=new Date();shown.setDate(1);details();break;case 'date':selected=b.dataset.date;details();break;case 'prev':case 'next':shown.setMonth(shown.getMonth()+(b.dataset.action==='prev'?-1:1));details();break;case 'markDate':mark(h,selected);details();break;case 'saveNote':{const n=$('note').value.trim();if(n)h.notes[selected]=n;else delete h.notes[selected];save();details();message('saved');break}case 'edit':editor(active);break;case 'restart':mark(h,today(),true);details();message('restartText');break;case 'delete':modal(t('deleteTitle'),`<p>${escape(t('deleteText'))}</p><div class="actions">${btn('close',escape(t('cancel')))}${btn('deleteGo',escape(t('deleteGo')),'','danger')}</div>`);break;case 'deleteGo':data.habits=data.habits.filter(h=>h.id!==active);save();render();close();message('deleted');break;case 'export':{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='chain-habits-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('exported');break}case 'import':$('importFile').click();break;case 'replace':if(pending){data=pending;pending=null;save();render();close();message('imported')}break}});
$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>1500000)throw Error();const v=JSON.parse(await f.text());if(!valid(v))throw Error();pending=v;modal(t('importTitle'),`<p>${escape(t('importText'))}</p><div class="actions">${btn('close',escape(t('cancel')))}${btn('replace',escape(t('replace')),'','primary')}</div>`)}catch{message('invalid')}});
document.addEventListener('keydown',e=>{if(!$('overlay').firstChild)return;if(e.key==='Escape')close();if(e.key==='Tab'){const els=[...$('overlay').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
document.querySelector('link[rel="icon"]').href='data:image/svg+xml,'+encodeURIComponent($('app-icon').innerHTML);
save();render();
