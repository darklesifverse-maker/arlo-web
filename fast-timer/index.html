const $=id=>document.getElementById(id),H=3600000,colors=['#6c9c80','#579a99','#a29a57','#bc875f'],key='fast-clock-v1';let storageOK=true,range=7,lastAd=0,state={lang:(navigator.language||'en').split('-')[0],theme:'system',plan:16,custom:15,active:null,history:[],rated:false};
try{let r=JSON.parse(localStorage.getItem(key)||'null');if(r&&typeof r==='object'){state={...state,...r};state.history=Array.isArray(r.history)?r.history.filter(x=>Number.isFinite(x.start)&&Number.isFinite(x.end)&&x.end>x.start&&Number.isFinite(x.goal)&&x.goal>0):[];if(!state.active||!Number.isFinite(state.active.start)||!Number.isFinite(state.active.goal)||state.active.goal<=0)state.active=null}}catch(e){storageOK=false}if(!I18N[state.lang])state.lang='en';if(![12,14,16,18,20,23,'custom'].includes(state.plan))state.plan=16;if(!(state.custom>=1&&state.custom<=23.5))state.custom=15;if(!['system','light','dark'].includes(state.theme))state.theme='system';
const t=k=>I18N[state.lang][k]||I18N.en[k];function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){storageOK=false}$('storageNote').textContent=storageOK?'':t('storage')}
window.APP_AD=(place)=>{};function ad(){if(Date.now()-lastAd>=180000){lastAd=Date.now();window.APP_AD('session_saved')}}function hours(){return state.plan==='custom'?state.custom:state.plan}function pname(p){return p==='custom'?t('custom'):p===23?'OMAD':p+':'+(24-p)}function dur(ms){let s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':')}function num(n){return new Intl.NumberFormat(state.lang,{maximumFractionDigits:1}).format(n)}function date(ms){return new Intl.DateTimeFormat(state.lang,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(ms)}function day(ms){let d=new Date(ms);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}function shifted(n){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}function streak(){let days=new Set(state.history.map(x=>day(x.end))),n=0,offset=days.has(day(Date.now()))?0:-1;while(days.has(day(shifted(offset-n))))n++;return n}function theme(){document.body.classList.toggle('dark',state.theme==='dark'||state.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function render(){document.documentElement.lang=state.lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('language').value=state.lang;$('theme').innerHTML=['system','light','dark'].map(k=>`<option value="${k}">${t(k)}</option>`).join('');$('theme').value=state.theme;theme();$('plans').innerHTML=[12,14,16,18,20,23,'custom'].map(p=>`<button class="plan" data-plan="${p}" aria-pressed="${state.plan===p}" ${state.active?'disabled':''}>${pname(p)}${p===23?'<small>23:1</small>':''}</button>`).join('');$('customBox').hidden=state.plan!=='custom';$('customHours').value=state.custom;$('customHours').disabled=!!state.active;$('planHint').textContent=t(state.active?'locked':'planHint');$('zones').innerHTML=[0,1,2,3].map(n=>`<div class="zone"><i style="background:${colors[n]}"></i><span>${t('z'+n)}</span><b>${['0–4','4–8','8–12','12+'][n]} h</b></div>`).join('');tick();journal()}
function tick(){let a=state.active,g=a?a.goal:hours()*H,e=a?Math.max(0,Date.now()-a.start):0,z=e<4*H?0:e<8*H?1:e<12*H?2:3;document.documentElement.style.setProperty('--zone',colors[z]);$('arc').style.strokeDashoffset=816.814*(1-Math.min(1,e/g));$('status').textContent=t(!a?'ready':e>=g?'complete':'running');$('elapsed').textContent=dur(e);$('remaining').textContent=dur(Math.abs(g-e))+' '+t(e>g?'extra':'left');$('zoneLabel').textContent=t('z'+z);$('planBadge').textContent=pname(a?a.plan:state.plan);$('startTime').textContent=a?date(a.start):'—';$('endTime').textContent=a?date(a.start+g):'—';$('mainAction').textContent=t(a?'finish':'start');$('timerHelp').textContent=t(a?'activeHelp':'timerHelp');if(a&&e>=g&&!a.notified){a.notified=true;persist();toast(t('goal'))}}
function journal(){let cutoff=new Date(shifted(-6)).setHours(0,0,0,0),w=state.history.filter(x=>x.end>=cutoff),sum=w.reduce((n,x)=>n+(x.end-x.start)/H,0);$('summary').innerHTML=`<div><b>${num(sum)}</b><span>${t('total')}</span></div><div><b>${w.length}</b><span>${t('count')}</span></div><div><b>${streak()}</b><span>${t('streak')}</span></div>`;let vals=Array.from({length:range},(_,i)=>{let d=shifted(i-range+1);return {d,v:state.history.filter(x=>day(x.end)===day(d)).reduce((n,x)=>n+(x.end-x.start)/H,0)}}),max=Math.max(1,...vals.map(x=>x.v));$('chart').innerHTML=vals.map((x,i)=>`<div class="col" title="${date(+x.d)} · ${num(x.v)} h"><div class="bar" style="height:${Math.max(3,x.v/max*110)}px"></div><small>${range===7?new Intl.DateTimeFormat(state.lang,{weekday:'narrow'}).format(x.d):i%5===0||i===29?x.d.getDate():''}</small></div>`).join('');$('chart').setAttribute('aria-label',t('journal')+': '+vals.map(x=>date(+x.d)+' '+num(x.v)+' h').join(', '));[7,30].forEach(n=>{$('days'+n).classList.toggle('selected',range===n);$('days'+n).setAttribute('aria-pressed',range===n)});$('entries').innerHTML=state.history.length?[...state.history].sort((a,b)=>b.end-a.end).map(x=>`<div class="entry"><div><b>${date(x.end)}</b><small>${date(x.start)} → ${date(x.end)}<br>${pname(x.plan)} · ${num(x.goal/H)} h</small></div><strong>${num((x.end-x.start)/H)} h</strong></div>`).join(''):`<div class="empty"><i aria-hidden="true">◷</i><b>${t('empty')}</b><p>${t('emptyNote')}</p></div>`}
let toastTimer;function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}function saved(){persist();render();toast(t('saved'));ad();if(state.history.filter(x=>x.end-x.start>=x.goal).length>=3&&!state.rated){state.rated=true;persist();$('rateDialog').showModal()}}
$('language').innerHTML=Object.entries({en:'English',es:'Español',pt:'Português',de:'Deutsch',fr:'Français',it:'Italiano',tr:'Türkçe',id:'Bahasa Indonesia'}).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('language').onchange=e=>{state.lang=e.target.value;persist();render()};$('theme').onchange=e=>{state.theme=e.target.value;persist();theme()};$('settings').onclick=()=>$('settingsDialog').showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('plans').onclick=e=>{let b=e.target.closest('[data-plan]');if(!b||state.active)return;state.plan=b.dataset.plan==='custom'?'custom':Number(b.dataset.plan);persist();render()};$('customHours').onchange=e=>{let n=Number(e.target.value);if(!Number.isFinite(n)||n<1||n>23.5){e.target.value=state.custom;return}state.custom=Math.round(n*2)/2;persist();render()};$('mainAction').onclick=()=>{if(!state.active){state.active={start:Date.now(),goal:hours()*H,plan:state.plan,notified:false};persist();render()}else{$('finishSummary').textContent=dur(Date.now()-state.active.start)+' · '+pname(state.active.plan);$('finishDialog').showModal()}};$('saveSession').onclick=()=>{if(!state.active)return;state.history.push({...state.active,end:Math.max(Date.now(),state.active.start+1)});state.active=null;$('finishDialog').close();saved()};$('days7').onclick=()=>{range=7;journal()};$('days30').onclick=()=>{range=30;journal()};function localInput(ms){let d=new Date(ms);return new Date(ms-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}$('add').onclick=()=>{$('logStart').value=localInput(Date.now()-hours()*H);$('logEnd').value=localInput(Date.now());$('logError').textContent='';$('addDialog').showModal()};$('saveLog').onclick=()=>{let start=+new Date($('logStart').value),end=+new Date($('logEnd').value);if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start||end>Date.now()||state.history.some(x=>start<x.end&&end>x.start)||state.active&&end>state.active.start){$('logError').textContent=t('invalid');return}state.history.push({start,end,goal:hours()*H,plan:state.plan});$('addDialog').close();saved()};matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();journal()}});setInterval(tick,1000);render();persist();
