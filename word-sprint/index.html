$('start').onclick=()=>{if(!store.learned&&phase==='idle')tutorial();else start()};$('clear').onclick=()=>{path=[];paintPath()};$('submit').onclick=submit;$('pause').onclick=()=>pause();$('settings').onclick=settings;$('sound').onclick=()=>{store.sound=!store.sound;save();translate();if(store.sound)beep(500)};document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='playing')pause()});window.addEventListener('blur',()=>{if(phase==='playing')pause()});
document.addEventListener('keydown',e=>{if(!$('modal').hidden){if(e.key==='Escape'){e.preventDefault();if(phase==='paused')pauseModal();else if(phase==='finished')home();else closeModal()}if(e.key==='Tab'){const els=[...$('panel').querySelectorAll('button,select')];const first=els[0],last=els.at(-1);if(!first)return;if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('panel'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$('panel'))){e.preventDefault();first.focus()}}return}if(phase==='playing'||phase==='tutorial'){if(e.key==='Enter'&&document.activeElement?.classList.contains('tile'))return;if(e.key==='Enter'){e.preventDefault();submit()}if(e.key==='Backspace'){e.preventDefault();path.pop();paintPath()}if(e.key==='Escape'&&phase==='playing')pause()}});
setInterval(()=>{if(phase!=='playing')return;const now=performance.now();remaining=Math.max(0,deadline-now);$('time').textContent=Math.ceil(remaining/1000);$('meter').style.width=remaining/600+'%';document.body.classList.toggle('urgent',remaining<=10000);if(now-lastWord>5000&&chain!==1){chain=1;$('combo').textContent='×1'}if(remaining<=10000){const beat=Math.floor((10000-remaining)/(remaining<4000?250:500));if(beat!==lastBeat){lastBeat=beat;beep(remaining<4000?760:540,.025)}}if(!path.length&&feedbackUntil&&now>=feedbackUntil){feedbackUntil=0;paintPath()}if(!remaining)finish()},100);home();
